name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Vitest ${{ matrix.vitest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One release from each peer range: ^2.1.9, ^3.2.6, and >=4.1.0 (4.x and 5.x).
        vitest: ['2.1.9', '3.2.7', '4.1.12', '5.1.1']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The lockfile already installs Vitest 5 with its peer Vite. Reinstalling that
      # same version with --legacy-peer-deps drops Vite, and Vitest 5 then fails to start.
      # npm's arborist throws "edgesOut" when Vitest 4 is installed without --legacy-peer-deps.
      - name: Select Vitest ${{ matrix.vitest }}
        run: |
          installed=$(node -p "require('./node_modules/vitest/package.json').version")
          if [ "$installed" != "${{ matrix.vitest }}" ]; then
            npm install vitest@${{ matrix.vitest }} --no-save --legacy-peer-deps
          fi

      - name: Require the selected Vitest
        run: node -e "const version=require('./node_modules/vitest/package.json').version; if (version !== '${{ matrix.vitest }}') { console.error('expected ${{ matrix.vitest }}, found ' + version); process.exit(1); }"

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm run test
